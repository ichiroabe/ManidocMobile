name: build

# リリースの起点は pubspec.yaml の version。
# 既定ブランチ (master) に push されたとき、その version に対応する v タグが
# まだ無ければ自動でタグを切って Releases まで公開する（タグ push は不要）。
# 手で v タグを push した場合もそのまま動く。
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # ローカル開発環境と同じ Flutter に固定する（Dart 3.12.2 / pubspec の sdk: ^3.10.4 を満たす）
  FLUTTER_VERSION: "3.44.6"

jobs:
  # --- リリース対象かどうかの判定 ---
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 既存タグと突き合わせるため履歴とタグを全部取る
          fetch-depth: 0

      - name: Decide version and tag
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 手動でタグを push した場合は無条件でリリース
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} (タグ push) をリリースします"
            exit 0
          fi

          # 例) "version: 1.0.1+2" -> "v1.0.1"（ビルド番号 +2 は落とす）
          VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)"
          if [[ -z "${VERSION}" ]]; then
            echo "::error::pubspec.yaml から version を読み取れませんでした"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # PR は検証のみ（ビルドはするがリリースはしない）
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR のためリリースはしません (version=${VERSION})"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} はリリース済みのためスキップします。配布したい変更がある場合は pubspec.yaml の version を上げて push してください。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} を新規リリースします"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # android/app/build.gradle.kts が JavaVersion.VERSION_17 を要求する
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ワークスペースは Storage Access Framework 経由で読み書きするため、
      # Firebase / Google サインインへの依存は無い。google-services.json も不要。

      # リリース署名鍵。debug キーはランナーごとに別物が自動生成されるため、
      # それで配ると版を跨いだ上書きインストールができず、Google サインインも
      # SHA-1 不一致で失敗する。配布物は必ずこの鍵で署名する。
      # 登録: キーストアを base64 化して ANDROID_KEYSTORE_BASE64 に貼る。
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 が未設定です。リリース用キーストアを base64 化して登録してください。"
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/release.keystore
          echo "android/app/release.keystore を復元しました"

      - name: Install dependencies
        run: flutter pub get

      # 既存の warning/info（未使用フィールド・未使用 import・deprecated 参照）が残っているため、
      # エラーのみを失敗条件にする。警告を潰したらこのフラグを外してよい。
      - name: Run static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # test/widget_test.dart が空の placeholder で `flutter test` が
      # exit 79 (No tests were found) になるため、実テストを書くまで CI からは外している。

      - name: Build APK
        env:
          # storeFile は android/app からの相対パスとして解決される
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${{ needs.prepare.outputs.version }}"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             manidoc_mobile_android.apk

      # 意図した鍵で署名されたか毎回確認する。ここに出る SHA-1 が
      # Google Cloud / Firebase に登録した値と一致していること。
      # keytool -printcert -jarfile は v1(JAR)署名しか読めず、今の APK は
      # v2/v3 署名のみなので "Not a signed jar file" になる。apksigner を使う。
      - name: Show signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          "${APKSIGNER}" verify --print-certs --verbose manidoc_mobile_android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: manidoc-mobile-android
          path: manidoc_mobile_android.apk
          if-no-files-found: error

  # ビルドが成功してから Release を作る（失敗時に中途半端な Release を残さない）
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # main への push 起点の場合、タグはここで初めて作られる（--target で今の commit に固定）
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::${TAG} の Release は既にあるのでアセットを差し替えます"
            gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
